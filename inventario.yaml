# Inventário do projeto Frank. Fonte da verdade para hosts, VMs e serviços.
# Preencher os campos marcados com TODO antes de implantar.

projeto: frank
descricao: Ecossistema de IA para Segurança
dominio_base: TODO.exemplo.com   # domínio gerenciado na Cloudflare

hosts:
  - nome: srv-frank-ia
    anterior: pc-gpu             # nome usado no mapa inicial
    sistema: Ubuntu Server 26.04.1 LTS
    kernel: 7.0.0-44-generic
    ip: 192.168.80.77
    gateway: 192.168.80.254
    rede: 1 Gb/s (enp30s0)
    papel: inferencia de IA (GPU)
    hardware:
      placa_mae: ASRock A320M-HD (BIOS P5.20, 2019)
      cpu: AMD Ryzen 5 3400G (4 núcleos / 8 threads)
      ram: 15 GB (2 x 8 GB DDR4 2400 MT/s)
      gpu: NVIDIA GeForce RTX 3080 (10 GB VRAM)
      driver_nvidia: 595.99.02 (CUDA 13.2)
    discos:
      - dispositivo: sda
        modelo: Crucial BX500 240 GB (CT240BX500SSD1)
        uso: sistema (LVM ubuntu-vg/ubuntu-lv de 100 GB, 121 GB livres no VG)
        observacao: usar o espaço livre do VG para modelos do Ollama
      - dispositivo: sdb
        modelo: Toshiba MQ01ABD1 (931 GB, HDD)
        uso: a definir (logs, backups ou arquivos antigos)
        observacao: partição sdb1 ext4 sem montagem; conferir conteúdo antes de montar
    servicos:
      - nome: ollama
        status: instalado para testes; pendente de configuração de acesso
        porta: 11434
        exposicao: somente 127.0.0.1 até definição de acesso pela rede interna
    pendencias:
      - confirmar a estratégia de acesso ao Ollama para o ubuntu-tools
      - definir o uso do HDD sdb

  - nome: pve-prod02
    sistema: Proxmox VE 9.2.2
    ip: 192.168.80.52
    papel: hypervisor
    hardware:
      cpu: 24 vCPUs (lógicas)
      ram: 62 GiB
    storages:
      local: diretório (padrão)
      local-lvm: LVM-thin (discos de sistema das VMs)
      dskprod02-dir: diretório (candidato para discos de logs; confirmar espaço com pvesm status)
    storage_logs: dskprod02-dir
    assinatura: nenhuma; configurar repositório pve-no-subscription
    pendencias:
      - rodar pvesm status e registrar espaço livre de cada storage
      - trocar o repositório para pve-no-subscription
      - trocar o certificado autoassinado

vms:
  - nome: alma-wazuh
    host: pve-prod02
    vmid: 101
    origem: appliance OVA wazuh-4.14.9.ova (importado com qm importovf)
    cpu: 4
    ram_gb: 8
    disco_sistema: local-lvm
    disco_logs_gb: 200        # disco dedicado para logs em dskprod02-dir (ver scripts/proxmox-add-log-disk.sh)
    montagem_logs: /srv/logs
    observacao: incluir /var/lib/wazuh-indexer em /srv/logs/wazuh ou apontar o indexador para o disco de logs
    servicos:
      - nome: wazuh-manager
        portas: [1514/tcp, 1515/tcp, 55000/tcp]
        exposicao: rede interna / agentes
      - nome: wazuh-dashboard
        portas: [443/tcp]
        exposicao: rede interna ou Cloudflare Access
    pendencias:
      - trocar as senhas padrão do appliance
      - registrar os agentes e ativar a detecção de vulnerabilidades

  - nome: ubuntu-infra
    host: pve-prod02
    vmid: TODO
    origem: ISO ubuntu-26.04.1-live-server-amd64.iso
    sistema: Ubuntu Server 26.04.1 LTS
    cpu: 2
    ram_gb: 4
    disco_sistema_gb: 40
    disco_logs_gb: 50
    montagem_logs: /srv/logs
    docker: true
    compose: infra/docker-compose.yml
    servicos:
      - nome: cloudflared
        exposicao: saída apenas (túnel)
      - nome: npm
        portas: [80/tcp, 443/tcp, 81/tcp]
        exposicao: 80/443 via túnel; 81 somente interna
      - nome: n8n
        portas: [5678/tcp]
        exposicao: via NPM com Cloudflare Access

  - nome: ubuntu-tools
    host: pve-prod02
    vmid: TODO
    origem: ISO ubuntu-26.04.1-live-server-amd64.iso
    sistema: Ubuntu Server 26.04.1 LTS
    cpu: 4
    ram_gb: 16
    disco_sistema_gb: 40
    disco_logs_gb: 100
    montagem_logs: /srv/logs
    docker: true
    compose: tools/docker-compose.yml
    servicos:
      - nome: thehive
        portas: [9000/tcp]
        exposicao: via NPM com Cloudflare Access
      - nome: cortex
        portas: [9001/tcp]
        exposicao: somente rede interna
      - nome: vuln-api-collectors
        exposicao: sem porta; jobs agendados
      - nome: threat-intelligence
        exposicao: sem porta; consumo pelo TheHive/Cortex

integracoes_api:
  - ABUSEIPDB (IP)
  - GreyNoise
  - VirusTotal
  - Pulsedive
  - AlienVault OTX
  - Shodan
  - Censys
  - urlscan.io
  - MalwareBazaar
  - Hybrid Analysis
  - URLhaus
  - NVD NIST
  - GitHub API
  - Have I Been Pwned

alertas_recomendados:
  - metrica: uso de disco /srv/logs
    limite: 80%
  - metrica: uso de disco sistema
    limite: 85%
  - metrica: VM offline
    limite: 5 minutos
