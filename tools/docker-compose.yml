# VM ubuntu-tools: TheHive, Cortex e dependências.
# TEMPLATE: validar versões compatíveis e os requisitos (Elasticsearch/Cassandra,
# memória e vm.max_map_count) na documentação oficial do TheHive/Cortex antes de subir.
# Antes de subir: sudo sysctl -w vm.max_map_count=262144

name: frank-tools

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0   # TODO validar versão compatível
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    volumes:
      - /srv/data/elasticsearch:/usr/share/elasticsearch/data
      - /srv/logs/elasticsearch:/usr/share/elasticsearch/logs
    networks: [frank-tools]

  thehive:
    image: strangebee/thehive:5.4   # TODO validar tag atual
    container_name: thehive
    restart: unless-stopped
    depends_on: [elasticsearch]
    ports:
      - "127.0.0.1:9000:9000"   # publicar via NPM + Cloudflare Access
    environment:
      - TZ=${TZ}
      - JVM_OPTS=-Xms1g -Xmx2g
    volumes:
      - /srv/data/thehive:/etc/thehive/data
      - /srv/logs/thehive:/var/log/thehive
    networks: [frank-tools]

  cortex:
    image: thehiveproject/cortex:3.1.8   # TODO validar tag atual
    container_name: cortex
    restart: unless-stopped
    depends_on: [elasticsearch]
    ports:
      - "127.0.0.1:9001:9001"   # somente rede interna
    environment:
      - TZ=${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # necessário para analisadores em containers
      - /srv/data/cortex:/opt/cortex/data
      - /srv/logs/cortex:/var/log/cortex
    networks: [frank-tools]

networks:
  frank-tools:
    name: frank-tools
