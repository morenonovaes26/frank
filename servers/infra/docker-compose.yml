# VM srv-frank-infra (192.168.80.74): Cloudflared, Nginx Proxy Manager e n8n.
# Variáveis vêm do .env da raiz do projeto (ligado automaticamente pelo bootstrap).
# Fixar versões das imagens antes de produção.

name: frank-infra

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks: [frank]

  npm-db:
    image: mariadb:11
    container_name: npm-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${NPM_DB_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: npm
      MYSQL_USER: npm
      MYSQL_PASSWORD: ${NPM_DB_MYSQL_PASSWORD}
      TZ: ${TZ}
    volumes:
      - /srv/data/npm-db:/var/lib/mysql
    networks: [frank]

  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:81:81"   # painel administrativo somente local (acessar via SSH ou túnel)
    environment:
      DB_MYSQL_HOST: npm-db
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: npm
      DB_MYSQL_PASSWORD: ${NPM_DB_MYSQL_PASSWORD}
      DB_MYSQL_NAME: npm
      TZ: ${TZ}
    volumes:
      - /srv/data/npm/data:/data
      - /srv/data/npm/letsencrypt:/etc/letsencrypt
      - /srv/logs/npm:/data/logs
    depends_on: [npm-db]
    networks: [frank]

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: n8n.${DOMAIN}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
    volumes:
      - /srv/data/n8n:/home/node/.n8n
      - /srv/logs/n8n:/home/node/logs
    networks: [frank]

networks:
  frank:
    name: frank
